<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="rakhiBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFF5F8"/>
      <stop offset="60%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </radialGradient>
    <linearGradient id="goldRakhi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="silkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <filter id="rakhiGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#rakhiBg)"/>

  <!-- Flowing Sacred Silk Red & Gold Kalava Threads in Background -->
  <path d="M-50 250 Q120 180 250 250 T550 250" fill="none" stroke="#D81B60" stroke-width="5" opacity="0.8"/>
  <path d="M-50 255 Q120 185 250 255 T550 255" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.9"/>
  <path d="M-50 245 Q120 175 250 245 T550 245" fill="none" stroke="#FF1744" stroke-width="2.5" opacity="0.75"/>

  <!-- Tassels / Latkan hanging from Rakhi -->
  <g stroke="#D81B60" stroke-width="2">
    <path d="M220 280 Q200 350 180 400"/>
    <circle cx="180" cy="405" r="7" fill="#FFD700"/>
    <path d="M280 280 Q300 350 320 400"/>
    <circle cx="320" cy="405" r="7" fill="#FFD700"/>
  </g>

  <!-- Ornate Center Rakhi Motif -->
  <g transform="translate(250, 250)">
    <!-- Outer Petal Radiance -->
    <g filter="url(#rakhiGlow)">
      {[0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map ? null : null}
      <!-- 12 Petals around Rakhi -->
      <path d="M0 -115 C20 -95 20 -70 0 -60 C-20 -70 -20 -95 0 -115 Z" fill="#FF1744"/>
      <path d="M57 -99 C70 -77 62 -54 42 -52 C31 -71 44 -91 57 -99 Z" fill="#FF1744"/>
      <path d="M99 -57 C103 -33 87 -15 67 -20 C64 -44 83 -57 99 -57 Z" fill="#FF1744"/>
      <path d="M115 0 C108 24 87 33 70 18 C80 -3 103 -11 115 0 Z" fill="#FF1744"/>
      <path d="M99 57 C85 77 62 77 52 57 C69 44 89 44 99 57 Z" fill="#FF1744"/>
      <path d="M57 99 C37 110 18 97 20 75 C41 73 57 85 57 99 Z" fill="#FF1744"/>
      <path d="M0 115 C-20 115 -25 93 -10 75 C10 80 15 105 0 115 Z" fill="#FF1744"/>
      <path d="M-57 99 C-70 90 -66 67 -45 60 C-40 82 -49 98 -57 99 Z" fill="#FF1744"/>
      <path d="M-99 57 C-107 35 -92 18 -72 20 C-74 44 -91 55 -99 57 Z" fill="#FF1744"/>
      <path d="M-115 0 C-110 -24 -90 -30 -75 -15 C-80 8 -105 13 -115 0 Z" fill="#FF1744"/>
      <path d="M-99 -57 C-85 -75 -65 -70 -55 -50 C-71 -40 -92 -45 -99 -57 Z" fill="#FF1744"/>
      <path d="M-57 -99 C-38 -107 -20 -90 -25 -70 C-45 -70 -57 -85 -57 -99 Z" fill="#FF1744"/>
    </g>

    <!-- Golden Ring of Pearls -->
    <circle r="72" fill="none" stroke="url(#goldRakhi)" stroke-width="7"/>
    <circle r="65" fill="#C2185B"/>

    <!-- Inner Golden Flower / Zari work -->
    <circle r="52" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Central Sparkling Gem (Ruby / Rudraksha / Diamond) -->
    <circle r="36" fill="url(#silkRed)" stroke="#FFF9C4" stroke-width="2"/>
    <polygon points="0,-22 16,-16 22,0 16,16 0,22 -16,16 -22,0 -16,-16" fill="url(#goldRakhi)"/>
    <circle r="12" fill="#FFFFFF" filter="url(#rakhiGlow)"/>
    <circle r="6" fill="#FF1744"/>
  </g>

  <!-- Sweet / Roli Tilak Plate Base -->
  <g transform="translate(110, 390)">
    <circle r="25" fill="#FFE082" stroke="#FFB300" stroke-width="2"/>
    <circle r="16" fill="#D50000"/> <!-- Roli Kumkum -->
  </g>
  <g transform="translate(390, 390)">
    <circle r="25" fill="#FFE082" stroke="#FFB300" stroke-width="2"/>
    <circle r="15" fill="#FFF9C4"/> <!-- Akshat Rice -->
    <circle cx="-5" cy="-3" r="2.5" fill="#FFFDE7"/>
    <circle cx="4" cy="4" r="2.5" fill="#FFFDE7"/>
    <circle cx="2" cy="-5" r="2" fill="#FFFDE7"/>
  </g>

  <!-- Title Text -->
  <text x="250" y="475" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="700" font-size="22" fill="#AD1457" letter-spacing="4">शुभ रक्षाबंधन</text>
</svg>
